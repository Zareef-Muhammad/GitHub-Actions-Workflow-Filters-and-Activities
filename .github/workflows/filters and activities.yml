name: Workflow Filters And Activities

on:
    workflow_dispatch: 
    push:
        branches: 
            - main
            - '!feature/**'
    pull_request:
        types:
            - opened
            - closed
        branches:
            - main
        paths-ignore:
            - 'README.md'
jobs:
  explore-filters:
    runs-on: ubuntu-latest
    steps:
        - name: Show Event Type
          run: echo "workflow executed for event - ${{github.event_name}}"
            